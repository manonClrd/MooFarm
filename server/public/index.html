<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm database</title>
<style>
  :root {
    --bg: #f7f6f2; --surface: #ffffff; --text: #2c2c2a; --muted: #5f5e5a;
    --border: #d3d1c7; --accent: #0f6e56; --accent-text: #ffffff;
    --row-alt: #faf9f5; --row-hover: #eef6f2; --danger: #a32d2d; --danger-bg: #fcebeb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b19; --surface: #262624; --text: #ecebe5; --muted: #a9a79e;
      --border: #403f3b; --accent: #5dcaa5; --accent-text: #04342c;
      --row-alt: #2a2a27; --row-hover: #20332d; --danger: #f09595; --danger-bg: #3b1c1c;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .muted { color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  button, input { font: inherit; color: inherit; }
  input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; width: 100%; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }

  .center { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 28px 24px; display: grid; gap: 6px; }
  .card p { margin: 0 0 10px; }
  .card label { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .card button { margin-top: 16px; padding: 10px 14px; }
  .error { background: var(--danger-bg); color: var(--danger); border-radius: 8px; padding: 8px 12px; margin: 10px 0 0 !important; font-size: 14px; }

  #app-view { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .who { display: flex; align-items: center; gap: 12px; font-size: 14px; }

  #tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; flex-wrap: wrap; }
  #tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 14px; color: var(--muted); }
  #tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input { max-width: 320px; }
  .toolbar #count { margin-right: auto; font-size: 14px; }

  #message { padding: 24px 0; text-align: center; }
  .table-wrap { overflow: auto; max-height: calc(100vh - 230px); min-height: 120px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
  th, td { padding: 8px 14px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: 0; }
  thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; padding: 0; }
  thead th button { width: 100%; text-align: left; border: 0; border-radius: 0; background: none; padding: 10px 14px;
    font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  thead th button .arrow { color: var(--muted); font-weight: 400; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  td.num, th.num button { text-align: right; justify-content: flex-end; font-variant-numeric: tabular-nums; }
  td.empty { color: var(--muted); }
</style>
</head>
<body>

<section id="login-view" class="center" hidden>
  <form id="login-form" class="card">
    <h1>Farm database</h1>
    <p class="muted">Sign in to browse the data.</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p id="login-error" class="error" role="alert" hidden></p>
    <button type="submit" id="login-btn" class="primary">Sign in</button>
  </form>
</section>

<div id="app-view" hidden>
  <header class="topbar">
    <h1>Farm database</h1>
    <div class="who"><span id="who"></span><button id="logout" type="button">Log out</button></div>
  </header>

  <nav id="tabs" role="tablist" aria-label="Tables"></nav>

  <div class="toolbar">
    <input id="filter" type="search" placeholder="Filter rows..." aria-label="Filter rows">
    <span id="count" class="muted" aria-live="polite"></span>
    <button id="refresh" type="button">Refresh</button>
  </div>

  <div id="message" class="muted" hidden></div>
  <div class="table-wrap">
    <table>
      <caption class="sr-only" id="caption"></caption>
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
  // Same origin as the API (served by Express), so relative URLs work and no CORS setup is needed.
  const TOKEN_KEY = "farm_token";
  let token = null;
  try { token = sessionStorage.getItem(TOKEN_KEY); } catch (e) {}

  const saveToken = (value) => {
    token = value;
    try { value ? sessionStorage.setItem(TOKEN_KEY, value) : sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  };

  const $ = (id) => document.getElementById(id);
  const fmtDate = (v) => (v ? String(v).slice(0, 10) : "");

  // Column definitions: what to show for each table. get(row, ctx) returns the displayed (and sorted) value.
  const cowLabel = (id, ctx) => {
    if (id === null || id === undefined) return "";
    const cow = ctx.cowsById && ctx.cowsById.get(id);
    return cow ? `${cow.tag} (#${id})` : `#${id}`;
  };

  const TABLES = {
    farm: {
      label: "Farms", path: "/farm",
      columns: [
        { label: "ID", get: (r) => r.farm_id, type: "num" },
        { label: "Name", get: (r) => r.name },
        { label: "Location", get: (r) => r.location },
      ],
    },
    cow: {
      label: "Cows", path: "/cow",
      prepare: (rows) => ({ cowsById: new Map(rows.map((c) => [c.cow_id, c])) }),
      columns: [
        { label: "ID", get: (r) => r.cow_id, type: "num" },
        { label: "Tag", get: (r) => r.tag },
        { label: "Sex", get: (r) => r.sex },
        { label: "Birth date", get: (r) => fmtDate(r.birth_date) },
        { label: "Farm", get: (r) => (r.farm && r.farm.name) || r.farm_id },
        { label: "Mother", get: (r, ctx) => cowLabel(r.mother_id, ctx) },
        { label: "Father", get: (r, ctx) => cowLabel(r.father_id, ctx) },
      ],
    },
    calving: {
      label: "Calvings", path: "/calving",
      columns: [
        { label: "ID", get: (r) => r.calving_id, type: "num" },
        { label: "Cow", get: (r) => (r.cow && r.cow.tag) || r.cow_id },
        { label: "Farm", get: (r) => (r.cow && r.cow.farm && r.cow.farm.name) || "" },
        { label: "Bull", get: (r) => (r.bull && r.bull.tag) || "" },
        { label: "Calf", get: (r) => (r.calf && r.calf.tag) || "" },
        { label: "Start date", get: (r) => fmtDate(r.start_date) },
        { label: "End date", get: (r) => fmtDate(r.end_date) },
        { label: "State", get: (r) => r.state },
      ],
    },
    user: {
      label: "Users", path: "/user", adminOnly: true,
      columns: [
        { label: "ID", get: (r) => r.user_id, type: "num" },
        { label: "First name", get: (r) => r.firstname },
        { label: "Last name", get: (r) => r.lastname },
        { label: "Username", get: (r) => r.username },
        { label: "Role", get: (r) => r.role },
        { label: "Farm", get: (r) => (r.farm && r.farm.name) || "" },
      ],
    },
  };

  const state = { key: null, rows: [], sortCol: null, sortDir: 1, filter: "", cache: {}, user: null, loadId: 0 };

  async function api(path, options = {}) {
    const headers = { "Content-Type": "application/json" };
    if (token) headers.Authorization = "Bearer " + token;
    const res = await fetch(path, { ...options, headers });
    const text = await res.text();
    let body = null;
    try { body = text ? JSON.parse(text) : null; } catch (e) {}
    if (!res.ok) {
      const err = new Error((body && body.error) || "Request failed (" + res.status + ")");
      err.status = res.status;
      throw err;
    }
    return body;
  }

  // ---------- views ----------
  function showLogin(message) {
    saveToken(null);
    state.cache = {};
    state.user = null;
    $("app-view").hidden = true;
    $("login-view").hidden = false;
    const box = $("login-error");
    box.hidden = !message;
    box.textContent = message || "";
    $("password").value = "";
    $("username").focus();
  }

  function showApp(user) {
    state.user = user;
    $("login-view").hidden = true;
    $("app-view").hidden = false;
    $("who").textContent = `${user.firstname} ${user.lastname} (${user.role})`;

    const tabs = $("tabs");
    tabs.replaceChildren();
    for (const [key, table] of Object.entries(TABLES)) {
      if (table.adminOnly && user.role !== "admin") continue;
      const b = document.createElement("button");
      b.type = "button";
      b.role = "tab";
      b.dataset.key = key;
      b.textContent = table.label;
      b.addEventListener("click", () => openTab(key));
      tabs.appendChild(b);
    }
    openTab(state.key && TABLES[state.key] && tabs.querySelector(`[data-key="${state.key}"]`) ? state.key : "farm");
  }

  function setMessage(text) {
    $("message").hidden = !text;
    $("message").textContent = text || "";
  }

  // ---------- tables ----------
  async function openTab(key, forceReload = false) {
    state.key = key;
    state.sortCol = null;
    state.sortDir = 1;
    state.filter = "";
    $("filter").value = "";
    for (const b of $("tabs").children) b.setAttribute("aria-selected", String(b.dataset.key === key));

    const table = TABLES[key];
    $("caption").textContent = table.label;
    if (forceReload) delete state.cache[key];

    if (!state.cache[key]) {
      state.rows = [];
      renderTable();
      setMessage("Loading...");
      const myLoad = ++state.loadId;
      try {
        const data = await api(table.path);
        if (myLoad !== state.loadId) return; // user switched tab meanwhile
        const ctx = table.prepare ? table.prepare(data) : {};
        state.cache[key] = data.map((row) => {
          const cells = table.columns.map((c) => c.get(row, ctx));
          return { cells, search: cells.join(" ").toLowerCase() };
        });
      } catch (err) {
        if (myLoad !== state.loadId) return;
        if (err.status === 401) return showLogin("Session expired, please log in again.");
        setMessage(err.status === 403 ? "You do not have permission to view this table." : "Could not load data: " + err.message);
        return;
      }
    }
    state.rows = state.cache[key];
    setMessage("");
    renderTable();
  }

  const isEmpty = (v) => v === null || v === undefined || v === "";

  function renderTable() {
    const table = TABLES[state.key];
    const cols = table.columns;
    const q = state.filter.trim().toLowerCase();

    let rows = q ? state.rows.filter((r) => r.search.includes(q)) : state.rows.slice();

    if (state.sortCol !== null) {
      const i = state.sortCol;
      const numeric = cols[i].type === "num";
      rows.sort((x, y) => {
        const a = x.cells[i], b = y.cells[i];
        if (isEmpty(a) || isEmpty(b)) return isEmpty(a) && isEmpty(b) ? 0 : isEmpty(a) ? 1 : -1;
        const c = numeric ? Number(a) - Number(b)
          : String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" });
        return c * state.sortDir;
      });
    }

    // header
    const tr = document.createElement("tr");
    cols.forEach((col, i) => {
      const th = document.createElement("th");
      if (col.type === "num") th.className = "num";
      th.setAttribute("aria-sort", state.sortCol === i ? (state.sortDir === 1 ? "ascending" : "descending") : "none");
      const btn = document.createElement("button");
      btn.type = "button";
      const label = document.createElement("span");
      label.textContent = col.label;
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = state.sortCol === i ? (state.sortDir === 1 ? "▲" : "▼") : "";
      btn.append(label, arrow);
      btn.addEventListener("click", () => {
        if (state.sortCol === i) state.sortDir = -state.sortDir;
        else { state.sortCol = i; state.sortDir = 1; }
        renderTable();
      });
      th.appendChild(btn);
      tr.appendChild(th);
    });
    document.querySelector("thead").replaceChildren(tr);

    // body
    const frag = document.createDocumentFragment();
    for (const row of rows) {
      const trow = document.createElement("tr");
      row.cells.forEach((value, i) => {
        const td = document.createElement("td");
        if (cols[i].type === "num") td.className = "num";
        if (isEmpty(value)) { td.textContent = "—"; td.classList.add("empty"); }
        else td.textContent = String(value);
        trow.appendChild(td);
      });
      frag.appendChild(trow);
    }
    document.querySelector("tbody").replaceChildren(frag);

    $("count").textContent = state.rows.length
      ? (q ? `${rows.length} of ${state.rows.length} rows` : `${rows.length} rows`)
      : "";
    if (state.rows.length && rows.length === 0) setMessage("No rows match your filter.");
    else if (!$("message").textContent.startsWith("Loading") && !$("message").textContent.startsWith("Could not")
             && !$("message").textContent.startsWith("You do not")) setMessage(state.rows.length || !state.cache[state.key] ? "" : "This table is empty.");
  }

  // ---------- events ----------
  $("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const btn = $("login-btn");
    btn.disabled = true;
    btn.textContent = "Signing in...";
    $("login-error").hidden = true;
    try {
      const data = await api("/auth/login", {
        method: "POST",
        body: JSON.stringify({ username: $("username").value.trim(), password: $("password").value }),
      });
      saveToken(data.token);
      showApp(data.user);
    } catch (err) {
      $("login-error").textContent = err.message;
      $("login-error").hidden = false;
    } finally {
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  });

  $("logout").addEventListener("click", () => showLogin(""));
  $("refresh").addEventListener("click", () => openTab(state.key, true));
  $("filter").addEventListener("input", (e) => { state.filter = e.target.value; renderTable(); });

  // ---------- start: reuse the token of this browser tab if it is still valid ----------
  (async function init() {
    if (!token) return showLogin("");
    try {
      showApp(await api("/auth/me"));
    } catch (err) {
      showLogin(err.status === 401 ? "Session expired, please log in again." : "");
    }
  })();
</script>
</body>
</html>
